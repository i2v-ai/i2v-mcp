name: Validate server metadata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: |
          node -e "
          const s = require('./server.json');
          const required = ['\$schema', 'name', 'title', 'description', 'repository', 'version', 'websiteUrl', 'remotes'];
          for (const key of required) if (!s[key]) throw new Error('server.json is missing ' + key);
          if (s.name !== 'io.github.i2v-ai/mcp') throw new Error('unexpected registry name');
          if (s.repository.url !== 'https://github.com/i2v-ai/i2v-mcp') throw new Error('repository URL must point here');
          if (s.remotes[0].url !== 'https://i2v.ai/api/mcp') throw new Error('unexpected remote endpoint');
          console.log('server.json is valid');
          "
